[package]
name = "simplefp-cli"
description = "Command-line interface for SimpleFP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "simplefp"
path = "src/main.rs"

[dependencies]
simplefp.workspace = true
simplefp-core.workspace = true
simplefp-tdt.workspace = true
clap = { version = "4.6", features = ["derive"] }
